databases:
  - name: sokomtaani-db
    databaseName: sokomtaani
    user: sokomtaani
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: sokomtaani-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: sokomtaani-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/schema/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: sokomtaani-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sokomtaani-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sokomtaani-redis
          property: connectionString
      - key: FRONTEND_BASE_URL
        value: https://sokomtaani.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://sokomtaani.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sokomtaani.vercel.app,https://*.vercel.app
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
